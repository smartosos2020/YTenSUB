name = "ytensub-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 创建：npx wrangler kv namespace create YTENSUB_KV，把返回的 id 填到这里
[[kv_namespaces]]
binding = "YTENSUB_KV"
id = "2a0d5452159940798f6c82416fbd05dd"

# 私有 D1 数据库（账号、卡密、入账凭证与登录验证码的唯一权威源，绝不存公开 R2 桶）
# 首次部署执行：
#   npx wrangler d1 create ytensub-db          # 把返回的 database_id 填入下方
#   npx wrangler d1 migrations apply ytensub-db --remote
# 本地开发初始化：
#   npx wrangler d1 migrations apply ytensub-db --local
[[d1_databases]]
binding = "DB"
database_name = "ytensub-db"
database_id = "aaad5a11-1655-4712-bdeb-7a6101843caf"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "ytensub-curated"

# DEV_MODE 不在 [vars] 里定义（会与 secret 冲突）。本地调试用 server/.dev.vars 提供 DEV_MODE=true；
# 生产如需临时开启（没配邮件服务时让验证码直接显示）：npx wrangler secret put DEV_MODE 输入 true；关闭用 secret delete
