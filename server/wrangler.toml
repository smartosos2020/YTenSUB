name = "ytensub-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 创建：npx wrangler kv namespace create YTENSUB_KV，把返回的 id 填到这里
[[kv_namespaces]]
binding = "YTENSUB_KV"
id = "2a0d5452159940798f6c82416fbd05dd"

# DEV_MODE 不在 [vars] 里定义（会与 secret 冲突）。本地调试用 server/.dev.vars 提供 DEV_MODE=true；
# 生产如需临时开启（没配邮件服务时让验证码直接显示）：npx wrangler secret put DEV_MODE 输入 true；关闭用 secret delete
