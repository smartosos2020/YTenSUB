<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP：限制远程代码注入；'unsafe-inline' 留给 dev HMR preamble 与运行时内联样式；
         connect-src 仅放行构建时配置的账号 API -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://yt3.ggpht.com; connect-src 'self' ytensub-media: ws: __YTENSUB_API_ORIGIN__; media-src 'self' ytensub-media: file: blob: https:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YTenSUB</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
